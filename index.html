<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Undangan Pernikahan Rani &amp; Dimas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#3a0a12;--deep:#240508;--cream:#f4e8da;--gold:#d9b48c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;background:var(--deep)}
body{font-family:'Poppins',sans-serif;color:var(--cream);background:var(--deep);overflow-x:hidden}
body.lock{overflow:hidden;height:100dvh}
#wrap{max-width:520px;margin:0 auto}

/* COVER */
#cover{position:fixed;inset:0;z-index:50;background:var(--deep);display:flex;justify-content:center;cursor:pointer;transition:opacity 1.1s ease,visibility 1.1s}
#cover .stage{position:relative;width:min(100vw,520px);height:100dvh}
#cover video{width:100%;height:100%;object-fit:cover;display:block}
#cover .name{position:absolute;left:0;right:0;top:74%;text-align:center;font-size:.85rem;font-weight:300;text-shadow:0 2px 10px rgba(0,0,0,.6);transition:opacity .5s}
#cover .name b{display:block;font:400 2.1rem 'Pinyon Script',cursive;margin-top:2px}
.ring{position:absolute;left:48.5%;top:60%;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(255,255,255,.85);animation:ring 2s ease-out infinite;transition:opacity .4s}
.ring.b{animation-delay:1s}
#cover.go .ring,#cover.go .name{opacity:0}
#cover.open{opacity:0;visibility:hidden}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.8);opacity:.9}to{transform:translate(-50%,-50%) scale(1.9);opacity:0}}

/* SLIDES */
.slide{position:relative;overflow:hidden;opacity:0;transform:translateY(40px);filter:blur(4px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1),filter 1s}
.slide.show{opacity:1;transform:none;filter:none}
.slide img{width:100%;display:block;aspect-ratio:478/850;object-fit:cover;background:var(--bg)}
.ov{position:absolute;left:0;right:0;text-align:center}
.btn{display:inline-block;border:1px solid var(--gold);border-radius:999px;padding:10px 22px;background:rgba(36,5,8,.7);color:var(--cream);font:400 .8rem 'Poppins';letter-spacing:.04em;text-decoration:none;cursor:pointer;backdrop-filter:blur(4px);transition:transform .25s,background .25s}
.btn:active{transform:scale(.95);background:var(--gold);color:var(--deep)}
.cd{display:flex;gap:7px;justify-content:center}
.cd div{width:56px;padding:6px 0;border-radius:12px;border:1px solid rgba(217,180,140,.7);background:rgba(36,5,8,.65)}
.cd b{display:block;font:500 1.15rem 'Poppins'}
.cd span{font-size:.56rem;letter-spacing:.08em;opacity:.85}
.hit{position:absolute;cursor:pointer;display:block}
.hint{font:300 .7rem 'Poppins';font-style:italic;opacity:.9}

/* RSVP */
#rsvp{padding:70px 28px 40px;text-align:center;background:radial-gradient(120% 70% at 50% 0%,#5a1220,var(--bg) 70%)}
#rsvp h2,.end h2{font:400 2.8rem 'Pinyon Script',cursive;line-height:1.2;margin-bottom:10px}
#rsvp p,.end p{font-weight:300;font-size:.88rem;opacity:.85}
form{display:grid;gap:12px;margin-top:26px;text-align:left}
input,select,textarea{width:100%;padding:14px 16px;border:1px solid rgba(217,180,140,.5);border-radius:14px;background:rgba(255,255,255,.07);color:var(--cream);font:300 .9rem 'Poppins'}
select option{color:#111}
::placeholder{color:rgba(244,232,218,.55)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
form .btn{padding:14px;background:var(--gold);color:var(--deep);font-weight:500;border:0;font-size:.9rem}
.end{padding:20px 28px 100px;text-align:center;background:var(--bg)}
.end h2{font-size:3rem;margin-top:14px}

/* LAIN-LAIN */
#music{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:rgba(36,5,8,.85);color:var(--cream);font-size:1.1rem;display:none;cursor:pointer}
#music.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:76px;transform:translate(-50%,20px);background:var(--gold);color:var(--deep);padding:9px 20px;border-radius:99px;font-size:.82rem;opacity:0;transition:.4s;z-index:60;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body class="lock">

<div id="cover">
  <div class="stage">
    <video id="cv" poster="01-cover.webp" muted playsinline preload="auto"><source src="01-cover.mp4" type="video/mp4"></video>
    <span class="ring"></span><span class="ring b"></span>
    <div class="name">Kepada Yth.<b id="guest">Tamu Undangan</b></div>
  </div>
</div>

<button id="music" aria-label="Musik">♪</button>
<div id="toast"></div>

<main id="wrap">
  <div class="slide"><img src="02-ayat.webp" alt="" loading="lazy"></div>
  <div class="slide"><img src="03-mempelai.webp" alt="" loading="lazy"></div>

  <div class="slide"><img src="04-savedate.webp" alt="" loading="lazy">
    <div class="ov" style="top:89.5%"><div class="cd" id="cd"></div></div>
  </div>

  <div class="slide"><img src="05-acara.webp" alt="" loading="lazy">
    <a class="hit" id="maps" href="#" target="_blank" rel="noopener" aria-label="Lokasi acara" style="left:22%;right:22%;top:43.5%;height:6%"></a>
    <div class="ov" style="top:50.5%"><a class="btn" id="saveDate" href="#" target="_blank" rel="noopener">Simpan di kalender</a></div>
  </div>

  <div class="slide"><img src="06-gift.webp" alt="" loading="lazy">
    <div class="hit" id="c1" style="left:10%;right:10%;top:39%;height:26%"></div>
    <div class="hit" id="c2" style="left:10%;right:10%;top:69%;height:26%"></div>
    <div class="ov" style="top:62.8%"><button class="btn" id="b1">Salin nomor rekening</button></div>
    <div class="ov" style="top:92.6%"><button class="btn" id="b2">Salin nomor rekening</button></div>
  </div>

  <div class="slide"><img src="07-galeri.webp" alt="" loading="lazy"></div>

  <section id="rsvp">
    <h2>Konfirmasi Kehadiran</h2>
    <p>Isi di bawah, lalu pesan terbuka di WhatsApp mempelai.</p>
    <form id="form">
      <input id="nm" placeholder="Nama Anda" required maxlength="80">
      <select id="st"><option>Hadir</option><option>Tidak hadir</option></select>
      <select id="jm"><option>1 orang</option><option>2 orang</option><option>3 orang</option><option>4 orang</option></select>
      <textarea id="ms" rows="3" placeholder="Ucapan dan doa untuk kami" maxlength="300"></textarea>
      <button class="btn" type="submit">Kirim lewat WhatsApp</button>
    </form>
  </section>

  <section class="end">
    <p>Merupakan kehormatan bagi kami bila Bapak/Ibu/Saudara/i berkenan hadir dan memberi doa restu.</p>
    <h2>Rani &amp; Dimas</h2>
    <p>Kami yang berbahagia</p>
  </section>
</main>

<script>
/* ====== UBAH DATA DI SINI ====== */
const DATA = {
  tanggal: "2026-11-26T09:00:00+07:00",
  kalenderMulai: "20261126T020000Z", kalenderAkhir: "20261126T060000Z",
  judulKalender: "Pernikahan Rani & Dimas",
  wa: "6281234567890",                       // nomor WA mempelai: 62..., tanpa +
  musik: "musik.mp3",
  lokasi: "Horison Altama Pandeglang",
  rekening: ["112345678890", "98765400311"]  // kartu atas, kartu bawah (samakan dengan desain)
};
/* =============================== */

const $ = s => document.querySelector(s);
const toast = t => { const e=$('#toast'); e.textContent=t; e.classList.add('on'); setTimeout(()=>e.classList.remove('on'),1800); };

const to = new URLSearchParams(location.search).get('to');
if (to) $('#guest').textContent = to.slice(0,60);

$('#saveDate').href = 'https://www.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(DATA.judulKalender)+'&dates='+DATA.kalenderMulai+'/'+DATA.kalenderAkhir;
$('#maps').href = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(DATA.lokasi);
['c1','c2','b1','b2'].forEach((id,k)=>{ const i=k%2; $('#'+id).onclick=()=>navigator.clipboard.writeText(DATA.rekening[i]).then(()=>toast('Nomor tersalin')).catch(()=>toast('Gagal menyalin')); });

// Countdown
const cd=$('#cd');
function tick(){
  let d=new Date(DATA.tanggal)-Date.now(); if(d<0)d=0;
  cd.innerHTML=[['Hari',864e5],['Jam',36e5],['Menit',6e4],['Detik',1e3]].map(([l,m])=>{const x=Math.floor(d/m);d-=x*m;return `<div><b>${String(x).padStart(2,'0')}</b><span>${l}</span></div>`}).join('');
}
tick(); setInterval(tick,1000);

// Halaman muncul halus + video main hanya saat terlihat
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting) e.target.classList.add('show');
}),{threshold:.3});
document.querySelectorAll('.slide').forEach(e=>io.observe(e));

// Musik
const mb=$('#music'); const audio=new Audio(DATA.musik); audio.loop=true; mb.style.display='block'; audio.onerror=()=>toast('File musik belum ada di GitHub');
mb.onclick=()=>{ if(audio.paused){audio.play();mb.classList.add('spin');}else{audio.pause();mb.classList.remove('spin');} };

// Ketuk amplop: video cover main, lagu mulai, lalu cover menghilang
let started=false;
const cover=$('#cover'), cv=$('#cv');
function openInvite(){
  if(cover.classList.contains('open')) return;
  cover.classList.add('open'); document.body.classList.remove('lock');
  started=true;
  
}
cover.onclick=()=>{
  if(cover.classList.contains('go')) return;
  cover.classList.add('go');
  audio.play().then(()=>mb.classList.add('spin')).catch(()=>{});
  cv.play().catch(()=>{});
  cv.addEventListener('ended',openInvite);
  setTimeout(openInvite,7500);
};

// RSVP -> WhatsApp
$('#form').onsubmit=e=>{
  e.preventDefault();
  const t=`Halo, saya ${$('#nm').value}.\nKonfirmasi: ${$('#st').value} (${$('#jm').value})\nUcapan: ${$('#ms').value||'-'}`;
  window.open('https://wa.me/'+DATA.wa+'?text='+encodeURIComponent(t),'_blank');
};
</script>
</body>
</html>
